<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>স্কুল ব্যবস্থাপনা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14232b;--mute:#5b6b73;--line:#d9e1e5;--bg:#f4f7f8;--card:#fff;--acc:#1f7a5a;--acc2:#e6f3ee;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:"Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.brand{font-weight:700;font-size:1.35rem;margin:18px 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
label{display:block;font-weight:500;margin:14px 0 6px}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}
input:focus,button:focus-visible{outline:3px solid #9fd3bf;outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 16px;background:var(--acc);color:#fff;width:100%;margin-top:18px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);width:auto;margin:0;padding:8px 14px}
button:disabled{opacity:.6}
.err{color:var(--err);margin:12px 0 0;font-weight:500}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.role{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:20px;padding:2px 12px;font-weight:600;font-size:.9rem}
.grid{display:grid;gap:10px;margin-top:16px}
.item{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;color:var(--mute);display:flex;justify-content:space-between}
.item b{color:var(--ink);font-weight:600}
@media print{
  body{background:#fff !important;color:#000 !important}
  .wrap{max-width:100% !important;margin:0 !important;padding:0 !important}
  .no-print,.top,button,select{display:none !important}
  .card{border:none !important;padding:0 !important}
  .marksheet-box{border:2px solid #1f7a5a !important;box-shadow:none !important;page-break-inside:avoid}
  @page{margin:10mm}
}
</style>
</head>
<body>
<div class="wrap" id="root"><p class="sub">লোড হচ্ছে…</p></div>
<script type="module" src="./app.js?v=12"></script>
</body>
</html>
